<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./boss-timer-manifest.json" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b6bf7" />
    <!-- 아이폰 홈 화면 추가(PWA) 시 주소창 없는 앱처럼 뜨게 한다. iOS 는 manifest 의
         display:standalone 을 안 봐서 이 세 메타태그가 따로 필요하다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="보스타이머" />
    <title>보스 타이머</title>
    <!-- Supabase 전용 빌드(vite.boss-timer.config.ts)는 react/react-dom 을 번들에 넣지 않고
         이 import map 으로 CDN 에서 불러온다. Netlify 빌드(vite.config.ts)는 react 를 그대로
         번들에 포함하므로 이 태그는 그냥 쓰이지 않는다. -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.8",
          "react-dom": "https://esm.sh/react-dom@19.2.8",
          "react-dom/client": "https://esm.sh/react-dom@19.2.8/client",
          "react/jsx-runtime": "https://esm.sh/react@19.2.8/jsx-runtime",
          "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.112.3"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/boss-timer/main.tsx"></script>
  </body>
</html>
