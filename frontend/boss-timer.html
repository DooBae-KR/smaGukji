<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/boss-timer-manifest.json" />
    <link rel="apple-touch-icon" href="/boss-timer-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b6bf7" />
    <!-- 아이폰 홈 화면 추가(PWA) 시 주소창 없는 앱처럼 뜨게 한다. iOS 는 manifest 의
         display:standalone 을 안 봐서 이 세 메타태그가 따로 필요하다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="보스타이머" />
    <title>보스 타이머</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/boss-timer/main.tsx"></script>
  </body>
</html>
