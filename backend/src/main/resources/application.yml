spring:
  application:
    name: smagukji-backend

  # .env 파일을 properties 형식으로 읽어들인다.
  # 저장소 루트(../.env) 와 backend/.env 를 모두 시도하고, 없으면 조용히 건너뛴다.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase 풀러 뒤에 있으므로 커넥션 수를 작게 유지한다.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: smagukji-pool

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 소유한다. Hibernate 는 절대 스키마를 바꾸지 않는다.
      # 매핑 드리프트를 잡고 싶으면 JPA_DDL_AUTO=validate 로 올려 실행해 보면 된다.
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true
        format_sql: true
        # 부대 목록처럼 지연 로딩 컬렉션을 여러 건 순회할 때 N+1 을 IN 절 몇 번으로 줄인다.
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    baseline-on-migrate: true
    baseline-version: 0

  jackson:
    # Jackson 3(Spring Boot 4) 기본값이 ISO-8601 문자열이라 별도 설정이 필요 없다.
    # SerializationFeature.WRITE_DATES_AS_TIMESTAMPS 는 Jackson 3 에서 제거됐다.
    default-property-inclusion: non_null

  web:
    error:
      # always 로 두면 Jackson 파싱 오류 메시지에 요청 본문 조각(비밀번호 포함 가능)이
      # 그대로 실려 나갈 수 있다. 사용자용 메시지는 GlobalExceptionHandler 가 만든다.
      include-message: never

  servlet:
    multipart:
      # MemberWeek 시트는 10KB 남짓이지만, 여러 주차를 합친 파일도 받을 수 있게 여유를 둔다.
      max-file-size: 20MB
      max-request-size: 24MB

server:
  port: ${SERVER_PORT:8080}

app:
  sheet:
    # 장수 분류 스프레드시트(CSV export). 비우면 /api/generals/sync-sheet 가 거부한다.
    general-csv-url: ${GENERAL_SHEET_CSV_URL:}
    # 장수·전법 이름 마스터 목록(구분/이름/이미지)
    roster-csv-url: ${ROSTER_SHEET_CSV_URL:}
    # «전법» 탭. 배워서 쓰는 전법 93개의 유형·특성·발동률·설명·등급·시즌
    tactic-csv-url: ${TACTIC_SHEET_CSV_URL:}
    # «버프» 탭. 회심·관통·침묵 같은 용어 설명
    buff-csv-url: ${BUFF_SHEET_CSV_URL:}
  security:
    # 인터넷에 노출한다면 8 이상으로 올리세요. 낮으면 기동 시 경고가 남습니다.
    min-password-length: ${APP_MIN_PASSWORD_LENGTH:4}
    supabase:
      # 로그인은 Supabase 가 하고, 여기서는 그 토큰만 검증한다.
      #
      # url 만 넣으면 나머지는 규칙대로 만들어 쓴다.
      #   공개키  <url>/auth/v1/.well-known/jwks.json
      #   발급자  <url>/auth/v1
      # 둘 다 공개 값이라 비밀로 다룰 필요가 없다.
      #
      # 비워두면 /api 전체가 잠긴다. 설정을 빠뜨린 채 열려 있는 것보다 낫다.
      url: ${SUPABASE_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  assets:
    # 장수/ 전법/ 하위 폴더를 가진 원본 PNG 디렉터리
    source-dir: ${ASSET_SOURCE_DIR:}
    import-on-startup: ${ASSET_IMPORT_ON_STARTUP:false}
  simulation:
    max-iterations: ${SIMULATION_MAX_ITERATIONS:200000}
    default-iterations: ${SIMULATION_DEFAULT_ITERATIONS:20000}
  ocr:
    # 전보 스크린샷 인식(NVIDIA 비전 모델, OpenAI 호환 chat/completions).
    #
    # 열쇠가 없으면 «전보 검증» 화면이 뜨긴 하지만 인식 버튼을 누르면 오류를 돌려준다.
    # NVIDIA API 사용은 비용이 들 수 있다 — https://build.nvidia.com 에서 확인하세요.
    nvidia:
      api-key: ${NVIDIA_API_KEY:}
      base-url: ${NVIDIA_API_BASE_URL:https://integrate.api.nvidia.com/v1/chat/completions}
      # 카탈로그에서 확인한 비전 모델로 바꾸려면 이 값만 바꾸면 된다.
      model: ${NVIDIA_OCR_MODEL:meta/llama-3.2-90b-vision-instruct}
      max-tokens: ${NVIDIA_OCR_MAX_TOKENS:2048}
      timeout-seconds: ${NVIDIA_OCR_TIMEOUT_SECONDS:60}
  integration:
    # 외부 시뮬레이션 프로젝트가 장수·전법·버프를 읽어갈 때 쓰는 열쇠.
    #
    # 사람이 아니라 서버가 부르는 창구라 로그인 화면을 거칠 수 없다. 미리 나눠 가진
    # 열쇠 하나로 /api/integration/** 만 연다(읽기 전용).
    #
    # 비워두면 그 구간이 통째로 닫힌다. 설정을 빠뜨린 채 데이터가 열려 있는 것보다 낫다.
    #   생성 예: openssl rand -base64 32
    api-key: ${INTEGRATION_API_KEY:}
    # 시뮬레이션 «화면» 이 브라우저에서 직접 부를 때만 그 주소를 넣는다.
    # 서버끼리 부르면 CORS 자체가 필요 없다. 브라우저에 열쇠가 노출된다는 점에 주의.
    allowed-origins: ${INTEGRATION_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.smagukji.backend: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
