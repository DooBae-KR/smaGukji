# Netlify 배포 설정 (프론트엔드 전용)
#
# 구조
#   Netlify   프론트 정적 파일 + 카드 이미지        — 항상 켜짐
#   Supabase  로그인·인사 데이터·장수/전법 조회      — 항상 켜짐
#   Render    덱 추천 시뮬레이션·시트 파싱          — 잠들어도 되는 계산 전용
#
# 처음 연결할 때
#   1. Netlify → Add new site → Import an existing project → 이 저장소 선택
#   2. 빌드 설정은 이 파일이 알려주므로 그대로 둔다
#   3. Site configuration → Environment variables 에 아래 4개를 넣는다
#        VITE_SUPABASE_URL        https://<프로젝트ref>.supabase.co
#        VITE_SUPABASE_ANON_KEY   Supabase → Project Settings → API → anon public
#        VITE_API_BASE_URL        https://smagukji.onrender.com/api
#        VITE_LOGIN_EMAIL_DOMAIN  smagukji.invalid   (선택, 기본값과 같음)
#   4. Deploy
#
# anon 키는 공개되는 값이다. 그것만으로는 아무 데이터도 읽히지 않는다.
# 실제 차단은 DB 의 RLS 정책이 한다(V18/V19 참고).

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# SPA 라우팅. 주소창에 /hr 을 직접 쳐도 index.html 이 뜨게 한다.
# 정적 파일이 있으면 그쪽이 먼저이므로 /cards/... 이미지는 이 규칙에 걸리지 않는다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 카드 이미지는 파일 이름이 내용 해시라, 내용이 바뀌면 이름도 바뀐다.
# 그래서 영구 캐시해도 안전하다.
[[headers]]
  for = "/cards/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html 은 항상 새로 받아야 새 빌드가 반영된다.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
