# Render 배포 설정 (https://render.com)
#
# 쓰는 법
#   1. GitHub 저장소를 Render 에 연결한다 (New > Blueprint > 이 저장소 선택)
#   2. Render 가 이 파일을 읽어 서비스를 만든다
#   3. Environment 탭에서 sync:false 로 표시된 값 3개를 직접 채운다
#        SUPABASE_DB_URL / SUPABASE_DB_USER / SUPABASE_DB_PASSWORD
#   4. Deploy
#
# ⚠️ 비밀값은 이 파일에 넣지 않는다. 커밋되는 파일이다.

services:
  - type: web
    name: smagukji
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Supabase 접속 정보 — Render 대시보드에서 직접 입력
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false

      # 무료 인스턴스는 메모리가 512MB 다. 커넥션 풀을 작게 유지한다.
      - key: DB_POOL_MAX_SIZE
        value: "3"
      - key: DB_POOL_MIN_IDLE
        value: "1"

      # 인터넷에 노출되므로 비밀번호 최소 길이를 올린다.
      # (기존 계정의 비밀번호는 그대로 쓸 수 있고, 새로 만들 때부터 적용된다)
      - key: APP_MIN_PASSWORD_LENGTH
        value: "8"

      - key: JPA_DDL_AUTO
        value: none
      - key: ASSET_IMPORT_ON_STARTUP
        value: "false"
