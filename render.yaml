# Render 배포 설정 (https://render.com)
#
# 쓰는 법
#   1. GitHub 저장소를 Render 에 연결한다 (New > Blueprint > 이 저장소 선택)
#   2. Render 가 이 파일을 읽어 서비스를 만든다
#   3. Environment 탭에서 sync:false 로 표시된 값 3개를 직접 채운다
#        SUPABASE_DB_URL / SUPABASE_DB_USER / SUPABASE_DB_PASSWORD
#   4. Deploy
#
# ⚠️ 비밀값은 이 파일에 넣지 않는다. 커밋되는 파일이다.

services:
  - type: web
    name: smagukji
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Supabase 접속 정보 — Render 대시보드에서 직접 입력
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false

      # 무료 인스턴스는 메모리가 512MB 다. 커넥션 풀을 작게 유지한다.
      - key: DB_POOL_MAX_SIZE
        value: "3"
      - key: DB_POOL_MIN_IDLE
        value: "1"

      # 인터넷에 노출되므로 비밀번호 최소 길이를 올린다.
      # (기존 계정의 비밀번호는 그대로 쓸 수 있고, 새로 만들 때부터 적용된다)
      - key: APP_MIN_PASSWORD_LENGTH
        value: "8"

      - key: JPA_DDL_AUTO
        value: none
      - key: ASSET_IMPORT_ON_STARTUP
        value: "false"

      # 로그인 검증에 쓰는 Supabase 주소. 공개 값이지만 프로젝트마다 달라 대시보드에서 넣는다.
      # 비어 있으면 토큰을 검증할 수 없으므로 /api 가 전부 잠긴다(열린 채 도는 것보다 낫다).
      - key: SUPABASE_URL
        sync: false

      # 프론트가 Netlify 로 분리돼 «다른 오리진» 이 됐다. 그 주소를 반드시 넣어야 한다.
      #   예) https://smagukji.netlify.app
      # 비워두면 브라우저가 모든 요청을 막는다. 와일드카드는 쓰지 않는다 —
      # 아무 사이트나 사용자의 토큰으로 이 API 를 부를 수 있게 된다.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # 전보 스크린샷 인식(NVIDIA 비전 모델). 비어 있으면 «전보 검증» 화면의 인식만 안 된다.
      - key: NVIDIA_API_KEY
        sync: false

      # 외부 시뮬레이션 프로젝트가 장수·전법·버프를 읽어갈 때 쓰는 열쇠(X-API-Key).
      # 대시보드에서 직접 넣는다. 비워두면 /api/integration/** 이 통째로 닫힌다.
      #   생성: openssl rand -base64 32
      - key: INTEGRATION_API_KEY
        sync: false

      # 시뮬레이션 «화면» 이 브라우저에서 직접 부를 때만 그 주소를 넣는다.
      # 서버끼리 부르면 CORS 가 필요 없으므로 보통 비워둔다.
      - key: INTEGRATION_ALLOWED_ORIGINS
        sync: false

      # «데이터» 탭의 시트 불러오기 버튼이 쓰는 값.
      # 공개 시트 URL 이라 비밀값은 아니지만, 시트가 바뀔 수 있어 대시보드에서 넣는다.
      # (./render-deploy.sh 를 쓰면 .env 값으로 자동 주입된다)
      - key: GENERAL_SHEET_CSV_URL
        sync: false
      - key: ROSTER_SHEET_CSV_URL
        sync: false
