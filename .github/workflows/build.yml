# 빌드 검증 + 컨테이너 이미지 발행
#
# 이 워크플로가 통과하면 Render / Fly.io 에서도 같은 Dockerfile 로 빌드된다.
# 로컬에 도커가 없어도 여기서 실제 이미지 빌드가 검증된다.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------
  # 1) 단위 테스트 — DB 가 필요 없는 것만 돌린다.
  #    BackendApplicationTests 는 실제 Supabase 에 붙으므로 CI 에서는 제외한다.
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: 백엔드 단위 테스트
        working-directory: backend
        run: ./gradlew test --tests "com.smagukji.backend.service.*" --no-daemon

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/reports/tests/test
          retention-days: 7

  # ---------------------------------------------------------------
  # 2) 프론트엔드 타입체크 + 빌드
  # ---------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 타입체크 + 빌드
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------
  # 3) Docker 이미지 빌드 — 배포 전에 Dockerfile 이 실제로 되는지 확인한다.
  #    main 에 푸시될 때만 GHCR 에 올린다. PR 은 빌드만 하고 버린다.
  # ---------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # 별도 시크릿이 필요 없다. GitHub 이 자동으로 넣어주는 토큰을 쓴다.
          password: ${{ secrets.GITHUB_TOKEN }}

      # 실패 시 어느 단계에서 깨졌는지 스텝 이름만 보고 알 수 있게 쪼갠다.
      # (Actions 로그는 인증이 있어야 읽을 수 있어서, 스텝 단위로 나눠두면 진단이 쉽다)
      - name: 진단 1/2 — 프론트엔드 스테이지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 진단 2/2 — 백엔드 스테이지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 태그 계산
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 이미지 빌드 (및 push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
