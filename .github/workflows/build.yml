# 빌드 검증 + 컨테이너 이미지 발행
#
# 이 워크플로가 통과하면 Fly.io 에서도 같은 Dockerfile 로 빌드된다.
# 로컬에 도커가 없어도 여기서 실제 이미지 빌드가 검증된다.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------
  # 1) 단위 테스트 — DB 가 필요 없는 것만 돌린다.
  #    BackendApplicationTests 는 실제 Supabase 에 붙으므로 CI 에서는 제외한다.
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: 백엔드 단위 테스트
        working-directory: backend
        run: ./gradlew test --tests "com.smagukji.backend.service.*" --no-daemon

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/reports/tests/test
          retention-days: 7

  # ---------------------------------------------------------------
  # 2) 프론트엔드 타입체크 + 빌드
  # ---------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 타입체크 + 빌드
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------
  # 3) Docker 이미지 빌드 — 배포 전에 Dockerfile 이 실제로 되는지 확인한다.
  #    main 에 푸시될 때만 GHCR 에 올린다. PR 은 빌드만 하고 버린다.
  # ---------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # 별도 시크릿이 필요 없다. GitHub 이 자동으로 넣어주는 토큰을 쓴다.
          password: ${{ secrets.GITHUB_TOKEN }}

      # 빌드 실패 시 로그 꼬리를 ::error:: 주석으로 내보낸다.
      # Actions 로그 본문은 인증이 있어야 읽을 수 있지만 주석은 공개 API 로 읽을 수 있어서,
      # 실패 원인을 밖에서 확인할 수 있는 유일한 통로다.
      - name: 백엔드 스테이지 빌드 (실패 시 로그를 주석으로 노출)
        run: |
          set +e
          docker build --target backend-api -f Dockerfile -t smagukji-diag . > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "----- build.log tail -----"
            tail -200 /tmp/build.log
            # 스택 트레이스가 아니라 «원인» 부분만 추린다.
            MSG=$(grep -E "What went wrong|Caused by:|Execution failed|> [A-Z]|error:|FAILURE" /tmp/build.log \
                  | grep -v "^\s*at " | head -25 \
                  | tr '\n' '⏎' | sed 's/%/%%/g' | cut -c1-3000)
            echo "::error title=backend stage failed::$MSG"
            exit 1
          fi
          echo "백엔드 스테이지 빌드 성공"

      - name: 태그 계산
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 이미지 빌드 (및 push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
