# Oracle Cloud Always Free 배포.
#
# 왜 옮기는가
#   Render 무료 인스턴스는 유휴 15분이면 잠들고 깨는 데 수십 초가 걸린다. 무중단이
#   최우선인 이상 맞지 않는다. Oracle Always Free 의 Ampere 인스턴스는 잠들지 않는다.
#
# 구조
#
#   인터넷 ──443──▶ web (nginx)  ─┬─▶ /            정적 파일을 직접 준다
#                                 └─▶ /api/*       api 로 넘긴다
#                    api (Spring) ─────▶ Supabase (DB · 인터넷 너머)
#
#   프론트와 API 가 «같은 도메인» 이라 브라우저에게는 같은 오리진이다. 그래서 CORS 를
#   아예 타지 않는다. CORS_ALLOWED_ORIGINS 를 비워 두는 것이 정상이다.
#
#   정적 파일을 자바가 아니라 nginx 가 주는 이유는 둘이다. 카드 이미지 160장과 판독기
#   부품 14MB 를 자바가 흘려보낼 이유가 없고, 백엔드를 재시작해도 화면은 살아 있다.
#
# 쓰는 법
#   1. cp .env.example .env 하고 값을 채운다
#   2. ./init-letsencrypt.sh    ← 최초 1회. 인증서를 처음 받는다
#   3. docker compose up -d --build
#
# ⚠️ api 는 호스트 포트를 열지 않는다. 8080 을 인터넷에 직접 노출하면 nginx 를 우회해
#    평문으로 접속할 수 있게 된다. 바깥을 향하는 것은 web 뿐이다.

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      # 프론트를 JAR 에 넣지 않는다. nginx 가 따로 주므로 넣으면 중복이고,
      # BuildKit 이 프론트 빌드 단계를 통째로 건너뛰어 빌드도 빨라진다.
      target: api
    image: smagukji-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Always Free 는 메모리가 넉넉하다(24GB). 그래도 컨테이너 한도에 맞춰 잡는다.
      JAVA_OPTS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC"
    expose:
      - "8080"
    healthcheck:
      # 컨테이너가 살아 있는 것과 앱이 응답하는 것은 다르다.
      # Flyway 마이그레이션까지 끝나야 응답하므로 start_period 를 넉넉히 준다.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    networks: [web]

  web:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.web
      args:
        # Vite 는 VITE_* 를 «빌드 시점에» 번들에 새긴다. 런타임 환경변수로는 안 바뀐다.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        # 비워 둔다. 같은 도메인의 /api 로 가면 nginx 가 api 로 넘긴다.
        VITE_API_BASE_URL: ""
    image: smagukji-web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # ⚠️ 이게 없으면 envsubst 가 $host·$remote_addr 같은 nginx 변수까지 빈 문자열로
      #    바꿔 설정이 통째로 망가진다. 바꿀 것은 DOMAIN 하나뿐이다.
      NGINX_ENVSUBST_FILTER: "DOMAIN"
    volumes:
      - ./nginx/app.conf.template:/etc/nginx/templates/app.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # 인증서가 갱신돼도 nginx 는 알아서 다시 읽지 않는다. 6시간마다 reload 한다.
    # 이게 없으면 «갱신은 됐는데 만료된 인증서를 계속 내주는» 상태가 된다.
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    networks: [web]

  # 동적 DNS 갱신. 공급자를 가리지 않는다.
  #
  # 왜 필요한가
  #   오라클 인스턴스를 중지했다 켜면 공인 IP 가 바뀔 수 있다(예약 IP 가 아닌 경우).
  #   그러면 도메인이 엉뚱한 곳을 가리켜 접속이 끊긴다. 5분마다 «지금 이 IP» 를 알려 준다.
  #
  # 공급자마다 주소 형식이 다르므로 .env 의 DDNS_UPDATE_URL 을 그대로 부른다. 어느 곳을
  # 쓰든 그쪽이 알려준 갱신 주소를 붙여 넣으면 된다. 비워 두면 아무 일도 하지 않는다
  # (예약 IP 를 쓰거나 진짜 도메인을 쓰는 경우).
  ddns:
    image: curlimages/curl:latest
    restart: unless-stopped
    environment:
      DDNS_UPDATE_URL: ${DDNS_UPDATE_URL:-}
    entrypoint: >
      sh -c 'if [ -z "$$DDNS_UPDATE_URL" ]; then echo "DDNS_UPDATE_URL 이 없어 갱신을 건너뜁니다"; sleep infinity; fi;
             while :; do
               curl -fsS "$$DDNS_UPDATE_URL" >/dev/null || echo "DDNS 갱신 실패";
               sleep 300;
             done'
    networks: [web]

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 12시간마다 만료가 가까운지 확인한다. 아직 멀었으면 아무것도 하지 않는다.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks: [web]

networks:
  web:
    driver: bridge
